    background-size: cover;
    background-position: center;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
  }

  .eyebrow {
    color: var(--gold);
    font-size: clamp(0.85rem, 2vw, 1.1rem);
    letter-spacing: 0.04em;
    margin-bottom: 12px;
    opacity: 0;
    animation: rise 0.8s ease-out 0.2s forwards;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-style: italic;
    color: #fff;
    font-size: clamp(2.6rem, 9vw, 6.2rem);
    line-height: 1.02;
    margin: 0;
    text-shadow: 0 6px 40px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(24px) scale(0.97);
    animation: rise 0.9s cubic-bezier(.19,1,.22,1) 0.4s forwards;
  }

  .sub {
    margin-top: 18px;
    color: rgba(255,255,255,0.85);
    font-size: clamp(1rem, 2.2vw, 1.25rem);
    max-width: 34ch;
    opacity: 0;
    animation: rise 0.8s ease-out 0.9s forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow, h1, .sub { animation: none; opacity: 1; transform: none; }
  }

  .countdown {
    margin-top: 34px;
    opacity: 0;
    animation: rise 0.8s ease-out 1.2s forwards;
  }

  .countdown-label {
    color: rgba(255,255,255,0.7);
    font-size: clamp(0.8rem, 1.8vw, 0.95rem);
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }

  .countdown-clock {
    display: flex;
    gap: 18px;
    justify-content: center;
  }

  .countdown-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 58px;
  }

  .countdown-value {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: #fff;
    font-size: clamp(1.6rem, 4.5vw, 2.4rem);
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 8px 6px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(4px);
  }

  .countdown-tag {
    margin-top: 6px;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.6);
  }

  .reveal {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .reveal.visible {
    display: flex;
  }

  .reveal .eyebrow {
    color: var(--gold);
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing: 0.1em;
    animation: rise 0.8s ease-out 0.1s forwards;
  }

  .reveal-sentence {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    color: #fff;
    font-size: clamp(1.8rem, 5.5vw, 3rem);
    line-height: 1.15;
    max-width: 20ch;
    text-shadow: 0 6px 40px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(24px) scale(0.97);
    animation: rise 0.9s cubic-bezier(.19,1,.22,1) 0.4s forwards;
  }
</style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="stage">
    <div class="eyebrow">Today is your day</div>
    <h1>Happy Birthday</h1>
    <div class="sub">Here's to another wonderful year ahead.</div>

    <div class="countdown">
      <div class="countdown-label" id="countdownLabel">24-hour celebration</div>
      <div class="countdown-clock">
        <div class="countdown-unit">
          <div class="countdown-value" id="cdHours">24</div>
          <div class="countdown-tag">HRS</div>
        </div>
        <div class="countdown-unit">
          <div class="countdown-value" id="cdMinutes">00</div>
          <div class="countdown-tag">MIN</div>
        </div>
        <div class="countdown-unit">
          <div class="countdown-value" id="cdSeconds">00</div>
          <div class="countdown-tag">SEC</div>
        </div>
      </div>
    </div>
  </div>

  <div class="stage reveal" id="revealStage">
    <div class="eyebrow">--.-</div>
    <div class="reveal-sentence">Send me a picture smiling</div>
  </div>

<script>
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const colors = ['#FFD166', '#FF6B6B', '#4ECDC4', '#FF6FA5', '#C77DFF', '#ffffff'];
  const shapes = ['circle', 'rect', 'ribbon'];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function makePiece(burst) {
    return {
      x: Math.random() * w,
      y: burst ? h * 0.4 + Math.random() * h * 0.2 : -20 - Math.random() * h,
      size: 6 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      shape: shapes[Math.floor(Math.random() * shapes.length)],
      speedY: 1.2 + Math.random() * 2.2,
      speedX: (Math.random() - 0.5) * 1.6,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 8,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.02 + Math.random() * 0.02,
      opacity: 0.85 + Math.random() * 0.15,
      vy: burst ? -(6 + Math.random() * 8) : 0
    };
  }

  const count = reduceMotion ? 0 : (window.innerWidth < 600 ? 90 : 160);
  let pieces = Array.from({ length: count }, () => makePiece(true));

  function draw(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;

    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.shape === 'rect') {
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else {
      ctx.fillRect(-p.size / 4, -p.size, p.size / 2, p.size * 2);
    }
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);

    for (const p of pieces) {
      if (p.vy < 0) {
        p.vy += 0.35;
        p.y += p.vy;
      } else {
        p.y += p.speedY;
      }
      p.sway += p.swaySpeed;
      p.x += p.speedX + Math.sin(p.sway) * 0.6;
      p.rotation += p.rotSpeed;

      if (p.y > h + 20) {
        Object.assign(p, makePiece(false), { y: -20 });
      }
      draw(p);
    }

    if (!reduceMotion) requestAnimationFrame(animate);
  }

  if (!reduceMotion) animate();
  else {
    // static scatter for reduced-motion users
    pieces.forEach(p => draw(p));
  }

  // ---- 24-hour countdown starting at 7:00 PM today (device local time) ----
  const cdLabel = document.getElementById('countdownLabel');
  const cdHours = document.getElementById('cdHours');
  const cdMinutes = document.getElementById('cdMinutes');
  const cdSeconds = document.getElementById('cdSeconds');
  const mainStage = document.querySelector('.stage:not(.reveal)');
  const revealStage = document.getElementById('revealStage');
  let revealed = false;

  const start = new Date();
  start.setHours(19, 0, 0, 0); // 7:00 PM today
  const end = new Date(start.getTime() + 24 * 60 * 60 * 1000); // +24 hours

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function updateCountdown() {
    const now = new Date();
    let diff, label;

    if (now < start) {
      diff = start - now;
      label = 'Celebration starts in';
    } else if (now < end) {
      diff = end - now;
      label = '24-hour celebration ends in';
    } else {
      diff = 0;
      label = "Time's up!";
      if (!revealed) {
        revealed = true;
        mainStage.style.display = 'none';
        revealStage.classList.add('visible');
      }
    }

    const totalSeconds = Math.max(0, Math.floor(diff / 1000));
    const hrs = Math.floor(totalSeconds / 3600);
    const mins = Math.floor((totalSeconds % 3600) / 60);
    const secs = totalSeconds % 60;

    cdLabel.textContent = label;
    cdHours.textContent = pad(hrs);
    cdMinutes.textContent = pad(mins);
    cdSeconds.textContent = pad(secs);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
